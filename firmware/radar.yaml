# Per-node espRadar v1.2.0 firmware (BL-07 dual-radar dispatcher).
#
# This file is the **per-node entry point**. It contains only the
# per-node substitutions (device_name, friendly_name, radar_type)
# and the `packages:` block that pulls in the platform-level
# (`_common.yaml.include`) and radar-specific
# (`radar_ld<type>.yaml`) blocks. The full schema is in those
# two include files.
#
# The `radar_type` substitution selects which radar-specific block
# to include. Valid values: `ld2410` (Hi-Link LD2410 / LD2410B /
# LD2410C, 256000 baud) and `ld2420` (Hi-Link LD2420, 115200 baud,
# 16 gates via the local `components/ld2420_energy/` listener).
# `scripts/preflight.py check_4_radar_yaml` validates the value and
# the schema consistency (across the per-node YAML and the
# include-olt blocks).
#
# To create a new node, run `scripts/new_node.sh <name> [radar_type]`.
# The script generates `firmware/<name>.yaml` from this template,
# swaps the substitutions, generates a per-node API encryption key
# (BL-06), and appends it to `firmware/secrets.yaml`.
#
# Wiring (BL-05): both radar modules wire TX → D7 (GPIO13), RX → D8
# (GPIO15), GND → GND. The VCC pin is radar-specific:
#   - LD2410: VCC → D1 mini **5V** rail (NOT 3V3 — see BL-05)
#   - LD2420: VCC → D1 mini 3V3 rail (the 16-gate module runs on 3V3)

substitutions:
  device_name: radar
  friendly_name: Radar presence
  # BL-07: every per-node YAML must declare its radar type. Set to
  # `ld2410` or `ld2420` to dispatch the schema check in
  # scripts/preflight.py check_4_radar_yaml.
  radar_type: ld2410
  # Logs on UART0 — must be 0 because D7/D8 (GPIO13/15) is the radar
  # UART. Setting this to anything non-zero would either collide
  # with the radar (UART0 mid-protocol) or break OTA (the bootloader
  # needs GPIO1/GPIO3 free for handshake).
  log_baud: "0"
  # Radar baud rate. The !included radar block references this
  # substitution; the actual value depends on the radar type:
  #   - ld2410: 256000 (out-of-the-box)
  #   - ld2420: 115200 (firmware >= v1.5.3)
  # The radar block only reads the substitution it cares about; the
  # other one is ignored.
  ld2410_baud: "256000"
  ld2420_baud: "115200"

# Pull in the platform-level and radar-specific blocks via ESPHome's
# `packages:` system. The order matters: `_common.yaml.include`
# defines the `esphome:`, `esp8266:`, `logger:`, `api:`, `ota:`,
# `wifi:`, `captive_portal:`, `web_server:` sections, and the
# radar-specific file appends the `uart:`, `ld2410:` (or `ld2420:`),
# `binary_sensor:`, `sensor:`, `text_sensor:`, `switch:`, `select:`,
# `number:`, `button:` sections.
packages:
  common: !include _common.yaml.include
  # BL-07: the `radar:` value points to the radar-specific include
  # file. The default is `radar_ld2410.yaml` (matches the default
  # `substitutions.radar_type: ld2410`). For an LD2420 node, run
  # `scripts/new_node.sh <name> ld2420` to generate a per-node YAML
  # with `radar: !include radar_ld2420.yaml` and `radar_type:
  # ld2420`. Do NOT run `esphome run radar.yaml` directly without
  # going through `new_node.sh` first — the per-node YAML
  # generation is what creates the per-node API encryption key
  # (BL-06) and appends it to `firmware/secrets.yaml`.
  radar: !include radar_ld2410.yaml
