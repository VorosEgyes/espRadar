substitutions:
  device_name: livingroom
  friendly_name: Livingroom presence
  # Logs on UART0 — must be 0 because D7/D8 (GPIO13/15) is the LD2410 UART.
  log_baud: "0"
  # LD2410 out-of-the-box baud rate is 256000. Hardware UART required.
  ld2410_baud: "256000"
  # The LD2410 reports per-gate energy in `engineering_mode` only.
  # Engineering mode auto-disables after 5 minutes (per Hi-Link spec).
  # The 9 gates (g0..g8) cover 0..6 m at 0.75 m resolution.
  # Room-specific tuning (timeout, max_move_distance_gate,
  # max_still_distance_gate, per-gate move/still_threshold) is set
  # after the first boot through openHAB and persisted automatically
  # to LD2410 EEPROM on every set. The substitutions here are only
  # for platform-level constants.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  # BL-01b: toolchain-xtensa@3.x (gcc 10.3.0) workaround.
  #
  # The pin to espressif8266@2.6.3 (gcc 5.2) is structurally
  # incompatible with ESPHome 2026.9.1, which hard-codes
  # `cg.set_cpp_standard("gnu++20")` and rejects any framework
  # < 3.0.0 (esphome/esphome@2026.9.1
  # esphome/components/esp8266/__init__.py:_arduino_check_versions).
  # gcc 5.2 does not understand `-std=gnu++20` (rejected as
  # "unrecognized command line option"). The 4.x toolchain (gcc
  # 10.3.0) supports gnu++20, but its libstdc++ headers are
  # inconsistent with `-std=gnu++20` when included via
  # `<functional>` (the cascade surfaces as "'std::size_t' has
  # not been declared" in <hashtable_policy.h> / <tuple>).
  #
  # The cascade happens because the toolchain's
  # libstdc++10 <tuple> and <hashtable_policy.h> assume `std::size_t`
  # is already in scope by the time they are first parsed, but
  # `<cstddef>` is not brought in early enough by ESPHome's
  # `component.h` → `<functional>` include chain. Pre-including
  # `<stddef.h>` via `-include stddef.h` puts `std::size_t` /
  # `std::ptrdiff_t` in scope before any toolchain header is
  # parsed.
  #
  # NB: `-include stddef.h` (NOT `cstddef`). The toolchain also
  # builds `.c` files (e.g. ESPAsyncTCP/tcp_axtls.c) which only
  # have the C standard library available; `-include cstddef` would
  # fail with "cstddef: No such file or directory" on those TUs.
  # `<stddef.h>` is valid in both C and C++ and declares the same
  # `size_t` / `ptrdiff_t` types in C++ (in `std::` as well).
  #
  # Pre-flight guard: scripts/preflight.py check_6 (renamed
  # check_6_cstddef_workaround, but it really checks for
  # `-include stddef.h`) verifies this flag is present.
  platformio_options:
    build_flags:
      - -include stddef.h
  on_boot:
    priority: 600
    then:
      - logger.log:
          level: INFO
          format: "ESPHome booted — LD2410 will report presence on openHAB object"
          tag: ld2410

esp8266:
  board: d1_mini
  framework:
    version: recommended

logger:
  level: INFO
  baud_rate: ${log_baud}

# Native API for openHAB via seime/openhab-esphome binding.
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  # The api.encryption.key above already authenticates uploaders.
  # Adding a separate OTA password wastes 3.5 KB flash + 60 B RAM
  # (warning from ESPHome 2026.9.1). Encrypting OTA requires only
  # the api encryption key.
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 5min
  # DHCP — host reservation by MAC on the router is the recommended way to
  # give each node a stable IP. See README → "Network setup".
  ap:
    # SSID limit is 32 — friendly_name is too verbose; use the short device_name.
    ssid: "${device_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

# Hardware UART on D7/D8 (GPIO13/GPIO15) — kept off UART0.
# The LD2410 ESPHome component is upstream-native (no local
# component needed). The legacy `components/ld2420_energy/`
# directory is kept in the repo for the v1.0.0 LD2420 build but
# is NOT loaded here. If a node is ever flashed with an LD2420
# module, swap to the v1.0.0 firmware (or uncomment the
# `external_components:` block below + switch the `ld2410:` /
# `ld2420:` / `sensor - platform:` blocks back to their v1.0.0
# values).
uart:
  id: ld2410_uart
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: ${ld2410_baud}
  parity: NONE
  stop_bits: 1

# Upstream LD2410 component — supports LD2410 / LD2410B / LD2410C
# (the C variant also has BLE, which we do not use).
# The id is referenced from the binary_sensor / sensor / number
# / select / button / switch blocks below.
ld2410:
  id: ld2410_hub

binary_sensor:
  # Two independent presence channels:
  # - has_target: moving OR still target detected
  # - has_moving_target: only moving (lower false-positive rate for
  #   "is anyone home right now" use cases)
  - platform: ld2410
    has_target:
      name: Presence
      device_class: occupancy
      # Hysteresis: stay on for 5 s after the radar goes quiet. Helps
      # with still-presence dropouts. The LD2410 default `settle: 1s`
      # filter is overridden by the explicit filter list below.
      filters:
        - delayed_off: 5s
  - platform: ld2410
    has_moving_target:
      name: Moving presence
      device_class: motion
      filters:
        - delayed_off: 5s
  - platform: ld2410
    has_still_target:
      name: Still presence
      device_class: occupancy
      filters:
        - delayed_off: 5s

sensor:
  # Core distances + energies (always available, no engineering mode).
  - platform: ld2410
    moving_distance:
      name: Moving distance
      unit_of_measurement: cm
      accuracy_decimals: 0
    still_distance:
      name: Still distance
      unit_of_measurement: cm
      accuracy_decimals: 0
    detection_distance:
      name: Detection distance
      unit_of_measurement: cm
      accuracy_decimals: 0
    moving_energy:
      name: Moving energy
      unit_of_measurement: "%"
      accuracy_decimals: 0
    still_energy:
      name: Still energy
      unit_of_measurement: "%"
      accuracy_decimals: 0
  # Per-gate energies (engineering mode only — sensor reports `unknown`
  # when engineering mode is off). The 9 gates cover 0..6 m at 0.75 m
  # resolution. Engineering mode auto-disables after 5 min (Hi-Link
  # firmware spec) so the per-gate sensors go to `unknown` in normal
  # use; switch `engineering_mode` on via openHAB for per-gate tuning.
  - platform: ld2410
    g0:
      move_energy:
        name: Gate 0 move energy
      still_energy:
        name: Gate 0 still energy
    g1:
      move_energy:
        name: Gate 1 move energy
      still_energy:
        name: Gate 1 still energy
    g2:
      move_energy:
        name: Gate 2 move energy
      still_energy:
        name: Gate 2 still energy
    g3:
      move_energy:
        name: Gate 3 move energy
      still_energy:
        name: Gate 3 still energy
    g4:
      move_energy:
        name: Gate 4 move energy
      still_energy:
        name: Gate 4 still energy
    g5:
      move_energy:
        name: Gate 5 move energy
      still_energy:
        name: Gate 5 still energy
    g6:
      move_energy:
        name: Gate 6 move energy
      still_energy:
        name: Gate 6 still energy
    g7:
      move_energy:
        name: Gate 7 move energy
      still_energy:
        name: Gate 7 still energy
    g8:
      move_energy:
        name: Gate 8 move energy
      still_energy:
        name: Gate 8 still energy

text_sensor:
  - platform: ld2410
    version:
      name: Firmware version
  - platform: ld2410
    mac_address:
      name: LD2410 MAC

# (LED diagnostics removed — LEDC is no longer a YAML section in
# ESPHome 2025.11+; it lives on the `output:` platform now. Presence
# state is already exposed via openHAB, so an on-board LED is not
# needed for this project.)

switch:
  - platform: restart
    name: Restart
  - platform: ld2410
    engineering_mode:
      name: Engineering mode
      # Engineering mode auto-disables after 5 minutes (Hi-Link
      # firmware spec) so per-gate energy sensors go to `unknown`
      # in normal use. Re-enable from openHAB for per-gate tuning.

# Tuning UI surfaces — every entity ends up in openHAB through the
# ESPHome binding. LD2410 persists every set_* to its EEPROM
# automatically; there is no separate `apply_config` button
# (unlike the LD2420 v1.0.0 firmware).
select:
  - platform: ld2410
    distance_resolution:
      name: Distance resolution
    baud_rate:
      name: UART baud rate
      # Changing this requires a reinstall with the matching
      # `uart.baud_rate:` above; ESPHome shows a warning.
    light_function:
      name: Light function
    out_pin_level:
      name: OUT pin level

number:
  - platform: ld2410
    max_move_distance_gate:
      name: Max move distance gate
    max_still_distance_gate:
      name: Max still distance gate
    timeout:
      name: None duration
    light_threshold:
      name: Light threshold
    g0:
      move_threshold:
        name: Gate 0 move threshold
      still_threshold:
        name: Gate 0 still threshold
    g1:
      move_threshold:
        name: Gate 1 move threshold
      still_threshold:
        name: Gate 1 still threshold
    g2:
      move_threshold:
        name: Gate 2 move threshold
      still_threshold:
        name: Gate 2 still threshold
    g3:
      move_threshold:
        name: Gate 3 move threshold
      still_threshold:
        name: Gate 3 still threshold
    g4:
      move_threshold:
        name: Gate 4 move threshold
      still_threshold:
        name: Gate 4 still threshold
    g5:
      move_threshold:
        name: Gate 5 move threshold
      still_threshold:
        name: Gate 5 still threshold
    g6:
      move_threshold:
        name: Gate 6 move threshold
      still_threshold:
        name: Gate 6 still threshold
    g7:
      move_threshold:
        name: Gate 7 move threshold
      still_threshold:
        name: Gate 7 still threshold
    g8:
      move_threshold:
        name: Gate 8 move threshold
      still_threshold:
        name: Gate 8 still threshold

button:
  - platform: ld2410
    restart:
      name: Restart module
    factory_reset:
      name: Factory reset
    query:
      name: Query current params