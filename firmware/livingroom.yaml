substitutions:
  device_name: livingroom
  friendly_name: Livingroom presence
  # Logs on UART0 — must be 0 because D7/D8 (GPIO13/15) is the LD2420 UART.
  log_baud: "0"
  # LD2420 firmware ≥ v1.5.3 uses 115200 baud.
  ld2420_baud: "115200"
  # Room-specific tuning (presence_timeout / min/max_gate_distance) is set
  # after the first boot through openHAB and persisted via the
  # "Apply config" button below. The substitutions here are only for
  # platform-level constants.

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  on_boot:
    priority: 600
    then:
      - logger.log:
          level: INFO
          format: "ESPHome booted — LD2420 will report presence on openHAB object"
          tag: ld2420

esp8266:
  board: d1_mini
  # Pin the espressif8266 platform to 2.6.3 (last release with the gcc 5.2
  # toolchain). 4.x pulls toolchain-xtensa@3.x (gcc 10.3.0) whose
  # libstdc++ headers are inconsistent with C++20 in -std=gnu++20 mode
  # (esphome 2026.9.1 builds with gnu++20 by default). The error
  # surfaces as "'std::size_t' has not been declared" cascades in
  # <hashtable_policy.h> / <tuple> when the upstream ESPHome
  # `ld2420` component pulls in <functional> via component.h. The
  # ld2420_energy component itself never includes <functional>, so
  # the error is not in our code.
  #
  # If ESPHome eventually requires espressif8266 >= 4.x, the workarounds
  # are: (a) override the c++ standard in the build_flags above to
  # -std=gnu++17, or (b) wait for an upstream toolchain-xtensa fix.
  platform_version: 2.6.3
  framework:
    version: recommended

logger:
  level: INFO
  baud_rate: ${log_baud}

# Native API for openHAB via seime/openhab-esphome binding.
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  # The api.encryption.key above already authenticates uploaders.
  # Adding a separate OTA password wastes 3.5 KB flash + 60 B RAM
  # (warning from ESPHome 2026.9.1). Encrypting OTA requires only
  # the api encryption key.
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  fast_connect: true
  reboot_timeout: 5min
  # DHCP — host reservation by MAC on the router is the recommended way to
  # give each node a stable IP. See README → "Network setup".
  ap:
    # SSID limit is 32 — friendly_name is too verbose; use the short device_name.
    ssid: "${device_name} Fallback"
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

# Local component that exposes per-gate energy as 16 sensors.
external_components:
  - source:
      type: local
      path: components
    components: [ld2420_energy]

# Hardware UART on D7/D8 (GPIO13/GPIO15) — kept off UART0.
uart:
  id: ld2420_uart
  tx_pin: GPIO15
  rx_pin: GPIO13
  baud_rate: ${ld2420_baud}
  parity: NONE
  stop_bits: 1

# Upstream LD2420 component — merged into ESPHome since 2023-11.
# In ESPHome 2025.11+ the max_gate_distance / min_gate_distance / presence_timeout
# keys moved to the `number:` platform below (as `initial_value:`).
# The id is referenced from the ld2420_energy platform.
ld2420:
  id: ld2420_hub

binary_sensor:
  - platform: ld2420
    has_target:
      name: Presence
      device_class: occupancy
      # Hysteresis: stay on for 5 s after the radar goes quiet, regardless of
      # presence_timeout above. Helps with still-presence dropouts.
      filters:
        - delayed_off: 5s

sensor:
  - platform: ld2420
    moving_distance:
      name: Moving distance
      unit_of_measurement: cm
      accuracy_decimals: 1
      filters:
        - clamp:
            min_value: 0
            max_value: 800
            ignore_out_of_range: true
  - platform: ld2420_energy
    ld2420_id: ld2420_hub
    gate_energy_0:
      name: Gate 0 energy
    gate_energy_1:
      name: Gate 1 energy
    gate_energy_2:
      name: Gate 2 energy
    gate_energy_3:
      name: Gate 3 energy
    gate_energy_4:
      name: Gate 4 energy
    gate_energy_5:
      name: Gate 5 energy
    gate_energy_6:
      name: Gate 6 energy
    gate_energy_7:
      name: Gate 7 energy
    gate_energy_8:
      name: Gate 8 energy
    gate_energy_9:
      name: Gate 9 energy
    gate_energy_10:
      name: Gate 10 energy
    gate_energy_11:
      name: Gate 11 energy
    gate_energy_12:
      name: Gate 12 energy
    gate_energy_13:
      name: Gate 13 energy
    gate_energy_14:
      name: Gate 14 energy
    gate_energy_15:
      name: Gate 15 energy

text_sensor:
  - platform: ld2420
    fw_version:
      name: Firmware version

# (LED diagnostics removed — LEDC is no longer a YAML section in
# ESPHome 2025.11+; it lives on the `output:` platform now. Presence
# state is already exposed via openHAB, so an on-board LED is not
# needed for this project.)

switch:
  - platform: restart
    name: Restart

# Tuning UI surfaces — every entity ends up in openHAB through the ESPHome binding.
select:
  - platform: ld2420
    operating_mode:
      name: Operating mode

number:
  # 2026 ESPHome ld2420 number schema does not accept `initial_value:` for
  # presence_timeout / min_gate_distance / max_gate_distance — those keys
  # default to firmware defaults (120 s, gate 1, gate 12). Set them once
  # from openHAB after the first boot, then press the **Apply config**
  # button below to persist the values into LD2420 EEPROM.
  - platform: ld2420
    presence_timeout:
      name: Presence timeout
    min_gate_distance:
      name: Min gate distance
    max_gate_distance:
      name: Max gate distance
    gate_select:
      name: Gate to set
    still_threshold:
      name: Still threshold
    move_threshold:
      name: Move threshold

button:
  - platform: ld2420
    apply_config:
      name: Apply config
    factory_reset:
      name: Factory reset
    restart_module:
      name: Restart module
    revert_config:
      name: Revert edits