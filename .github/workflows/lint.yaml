name: YAML lint
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install yamllint
        run: pip install yamllint==1.35.1
      - name: Lint firmware YAML
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 120}, truthy: {allowed-values: ['true','false','on','off','yes','no']}, document-start: disable}}}" firmware/livingroom.yaml firmware/secrets.yaml.example